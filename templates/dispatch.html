<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Dispatch</title>
<style>
:root{--bg:#0f172a;--panel:#16213e;--panel2:#1c2a4a;--line:#26365c;--ink:#e8eefc;
--muted:#93a4c4;--gold:#f5a623;--green:#37c98b;--red:#e5544b;--blue:#5b8def}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,'Segoe UI',Arial,sans-serif;font-size:14px}
.wrap{max-width:920px;margin:0 auto;padding:16px 14px 60px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:19px;margin:0}
.pulse{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--green);
margin-right:6px;animation:pu 2s infinite}
@keyframes pu{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.mode{font-size:12px;padding:5px 10px;border-radius:99px;font-weight:700}
.m-live{background:rgba(55,201,139,.15);color:var(--green)}
.m-prac{background:rgba(245,166,35,.15);color:var(--gold)}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:center}
.sc b{display:block;font-size:20px}
.sc span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sec{margin:20px 0 8px;font-size:11px;font-weight:800;letter-spacing:.12em;
text-transform:uppercase;color:var(--gold)}
.hint{font-size:11.5px;color:var(--muted);margin:0 0 8px;line-height:1.45}
.next{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ag{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;position:relative}
.ag.up{border-color:var(--gold);background:linear-gradient(135deg,var(--panel),#1f2540)}
.ag .who{font-weight:800;font-size:14px}
.ag .upchip{position:absolute;top:-8px;right:10px;background:var(--gold);color:#0f172a;
font-size:9px;font-weight:900;letter-spacing:.08em;border-radius:99px;padding:2px 8px}
.ag .row{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.ag .busy{color:var(--red);font-weight:700}
.ag .free{color:var(--green);font-weight:700}
.ag .geo{color:var(--blue)}
.lead{background:var(--panel);border:1px solid var(--line);border-radius:12px;
padding:12px 14px;margin-bottom:8px}
.lh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center}
.nm{font-weight:750;font-size:14.5px}
.meta{color:var(--muted);font-size:11.5px;margin:.15rem 0 .35rem}
.hist{font-size:11px;color:var(--muted)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:7px}
.fill{height:100%;background:var(--gold);border-radius:99px;transition:width 1s linear}
.cd{font-size:11px;color:var(--gold);font-weight:700}
.pick{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.pick button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.pick button:hover{border-color:var(--gold)}
.ghost{opacity:.7}
.spin{color:var(--muted);padding:26px;text-align:center}
details summary{cursor:pointer;color:var(--muted);font-size:12px;padding:6px 0}
@media(max-width:600px){.score{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span class="pulse"></span>Dispatch</h1>
    <span class="mode" id="mode">…</span>
  </div>
  <p class="hint" style="margin-top:6px">Your workflow doesn't change: set the appointment
  in FUB with the agent invited. This console answers one question while the lead is still
  on your line: <b style="color:var(--ink)">who should get this one?</b></p>

  <div class="score" id="score"></div>
  <div id="board"><div class="spin">Loading…</div></div>
</div>
<script>
var KEY=new URLSearchParams(location.search).get('key')||'';
var DATA=null;
function qs(p){return p+(p.indexOf('?')>-1?'&':'?')+'key='+encodeURIComponent(KEY);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function agentCard(a,i){
  var badges=[];
  if(a.on_appt_now)badges.push('<span class="busy">ON AN APPT NOW</span>');
  else badges.push('<span class="free">available</span>');
  if(a.appts_today)badges.push(a.appts_today+' appt'+(a.appts_today>1?'s':'')+' today');
  if(a.open_offers)badges.push(a.open_offers+' offer in hand');
  var hist=[];
  if(a.accept_rate!=null)hist.push('accepts '+a.accept_rate+'%');
  if(a.median_accept_secs!=null)hist.push('in ~'+a.median_accept_secs+'s');
  if(a.called_pct!=null)hist.push('calls '+a.called_pct+'% of handoffs');
  var geo=(a.geo&&a.geo.length)?'<div class="row geo">📍 also takes: '+a.geo.map(esc).join(', ')+'</div>':'';
  return '<div class="ag'+(i===0?' up':'')+'">'+(i===0?'<span class="upchip">NEXT UP</span>':'')+
    '<div class="who">'+esc(a.agent)+'</div>'+
    '<div class="row">'+badges.join(' · ')+'</div>'+
    '<div class="row">'+(hist.join(' · ')||'no dispatch history yet')+'</div>'+geo+'</div>';
}

function leadCard(l,withButtons){
  var open=(l.offers||[]).find(function(o){return !o.accepted&&!o.passed&&!o.expired;});
  var h='<div class="lead"><div class="lh"><span class="nm">'+esc(l.name||'Unknown')+'</span>';
  if(open)h+='<span class="cd" data-left="'+(open.secs_left||0)+'" data-agent="'+esc(open.agent)+'">'+
    fmtCd(open.secs_left||0)+' · '+esc(open.agent)+'</span>';
  h+='</div><div class="meta">'+esc(l.city||'')+(l.stage?' · '+esc(l.stage):'')+
     (l.assigned_to?' · in FUB: '+esc(l.assigned_to):'')+'</div>';
  if(l.offers&&l.offers.length){
    h+='<div class="hist">'+l.offers.map(function(o){
      var s=o.accepted?('✓ accepted'+(o.accept_secs!=null?' in '+o.accept_secs+'s':'')):
        o.passed?('passed: '+esc(o.pass_reason||'')):o.expired?'let it expire':'deciding…';
      return esc(o.agent)+' '+s;}).join(' → ')+'</div>';
  }
  if(open){
    var pct=Math.min(100,Math.round((open.secs_left||0)/3));
    h+='<div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>';
  }
  if(withButtons&&!open){
    h+='<div class="pick">'+(DATA.agents||[]).map(function(a){
      return '<button onclick="offer(\''+esc(l.person_id)+'\',\''+esc(a.agent)+'\')">'+esc(a.agent)+'</button>';
    }).join('')+'</div>';
  }
  return h+'</div>';
}
function fmtCd(s){var m=Math.floor(s/60);return m+':'+('0'+(s%60)).slice(-2);}
function section(title,body,hint){
  if(!body)return '';
  return '<div class="sec">'+title+'</div>'+(hint?'<p class="hint">'+hint+'</p>':'')+body;
}

function render(d){
  DATA=d;
  document.getElementById('mode').className='mode '+(d.live?'m-live':'m-prac');
  document.getElementById('mode').textContent=d.live?'LIVE':'PRACTICE MODE · goes live next week';
  var sc=d.score||{};
  document.getElementById('score').innerHTML=
    '<div class="sc"><b>'+(sc.today_dispatched||0)+'</b><span>dispatched today</span></div>'+
    '<div class="sc"><b>'+(sc.today_accepted||0)+'</b><span>accepted today</span></div>'+
    '<div class="sc"><b>'+(sc.today_avg_accept_secs!=null?sc.today_avg_accept_secs+'s':'—')+'</b><span>avg time to accept</span></div>'+
    '<div class="sc"><b>'+(sc.week_dispatched||0)+'</b><span>this week</span></div>';
  var q=d.queue||[];
  var open=q.filter(function(l){return l.open_offer;});
  var needs=q.filter(function(l){return l.terminal;});
  var accepted=q.filter(function(l){return l.accepted;});
  var rest=q.filter(function(l){return !l.open_offer&&!l.terminal&&!l.accepted;});
  var h='';
  h+=section('Who should get this one?',
    '<div class="next">'+(d.agents||[]).map(agentCard).join('')+'</div>',
    'Live right now. Gold card = next in rotation. Invite them on the appointment and the machine does the rest.'+
    (d.live?'':' (In practice mode nothing sends; this panel still tells you who is really available.)'));
  h+=section('⏱ In flight',
    open.map(function(l){return leadCard(l,false);}).join(''),
    open.length?'The clock is running. If it hits zero it moves to the next agent by itself.':'');
  h+=section('🔴 Needs you',
    needs.map(function(l){return leadCard(l,true);}).join(''),
    needs.length?'Three agents let these pass. Pick someone or take it yourself.':'');
  if(!d.live&&(d.shadow||[]).length){
    h+=section('👻 Practice log',
      d.shadow.map(function(s){
        var t=s.at?new Date(s.at).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'}):'';
        return '<div class="lead ghost"><b>'+esc(s.person_name||'A lead')+'</b> → the green button would have gone to <b>'+
          esc((s.payload||{}).would_offer_to||s.agent_name||'next in rotation')+'</b> <span class="meta" style="display:inline">'+t+'</span></div>';
      }).join(''),
      'Your appointments this week and what the machine would have done. When this list matches your intent, we go live.');
  }
  h+=section('✓ Landed',
    accepted.slice(0,4).map(function(l){return leadCard(l,false);}).join(''),'');
  if(rest.length){
    h+='<details><summary>'+rest.length+' older tagged leads (already assigned) — open to re-dispatch one</summary>'+
       rest.map(function(l){return leadCard(l,true);}).join('')+'</details>';
  }
  document.getElementById('board').innerHTML=h;
}

function load(){
  fetch(qs('/api/dispatch/queue')).then(r=>r.json()).then(function(d){
    if(d.error){document.getElementById('board').innerHTML='<div class="spin">'+esc(d.error)+'</div>';return;}
    render(d);
  }).catch(function(e){
    document.getElementById('board').innerHTML='<div class="spin">Reconnecting… ('+esc(e.message)+')</div>';
  });
}
function offer(pid,agent){
  fetch(qs('/api/dispatch/offer'),{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({person_id:pid,agent_name:agent})})
  .then(r=>r.json()).then(function(d){if(d.error)alert(d.error);load();});
}
// countdowns tick locally every second; data refreshes every 12s
setInterval(function(){
  document.querySelectorAll('.cd[data-left]').forEach(function(el){
    var s=Math.max(0,parseInt(el.getAttribute('data-left'),10)-1);
    el.setAttribute('data-left',s);
    el.textContent=fmtCd(s)+' · '+el.getAttribute('data-agent');
    var f=el.closest('.lead');if(f){var bar=f.querySelector('.fill');
      if(bar)bar.style.width=Math.min(100,Math.round(s/3))+'%';}
  });
},1000);
load();
setInterval(load,12000);
</script>
</body>
</html>
