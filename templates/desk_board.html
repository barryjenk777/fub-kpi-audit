<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap">
<meta name="robots" content="noindex">
<title>Lead Claims</title>
<style>
body{margin:0;background:#f4f2ec;color:#191b1e;font-family:'Archivo',-apple-system,'Segoe UI',sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:1.6rem 1rem 3rem}
.kick{font-size:.62rem;font-weight:800;letter-spacing:.18em;color:#2340d6;text-transform:uppercase}
h1{font-size:1.45rem;font-weight:850;margin:.25rem 0 1rem}
.calm{background:#e4f2ea;border:1px solid #bcdccb;color:#0d7a4e;border-radius:12px;
  padding:.85rem 1.1rem;font-weight:700;margin-bottom:1rem;display:none}
.alert{background:#fbeae4;border:1px solid #eec7bb;color:#d7401f;border-radius:12px;
  padding:.85rem 1.1rem;font-weight:700;margin-bottom:1rem;display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-bottom:1.2rem}
.tile{background:#fdfcf8;border:1px solid #e1ddd0;border-radius:12px;padding:.8rem .9rem}
.tile b{display:block;font-size:1.5rem;font-weight:900;color:#191b1e}
.tile span{font-size:.72rem;color:#6e7268}
.row{background:#fdfcf8;border:1px solid #e1ddd0;border-radius:12px;
  padding:.85rem 1rem;margin-bottom:.55rem}
.row .top{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.row .name{font-weight:850;font-size:1.02rem}
.v{font-size:.64rem;font-weight:800;letter-spacing:.12em;padding:.14rem .5rem;
  border-radius:99px;text-transform:uppercase}
.v-hot{background:#f6ead6;color:#b45309}.v-steady{background:#e4f2ea;color:#0d7a4e}
.v-str{background:#f6ead6;color:#b45309}.v-quiet{background:#e1ddd0;color:#6e7268}
.v-warm{background:#e3eafc;color:#2340d6}
.chip{font-size:.66rem;color:#6e7268;background:#f4f2ec;border:1px solid #e1ddd0;
  border-radius:99px;padding:.1rem .5rem}
.line{font-size:.86rem;color:#3c3f38;margin-top:.3rem}
.act{font-size:.8rem;font-weight:800;color:#2340d6;margin-top:.15rem}
h2{font-size:.78rem;font-weight:800;letter-spacing:.14em;color:#6e7268;
  text-transform:uppercase;margin:1.4rem 0 .6rem}
.feed{font-size:.82rem;color:#55584f}
.feed div{padding:.32rem 0;border-bottom:1px solid #e7e4d8}
.feed .ok{color:#0d7a4e}.feed .bad{color:#d7401f}
.stamp{font-size:.68rem;color:#9b9e93;margin-top:1.2rem}
</style></head><body><div class="wrap">
<div class="kick">Legacy Command Center</div>
<h1>Lead Claims</h1>
<div id="ca-door" style="margin:0 0 12px"></div>
<div class="calm" id="calm">Nothing needs you today. Every claim is being worked and every lead reached a human.</div>
<div class="alert" id="alert"></div>
<div class="tiles" id="tiles"></div>
<div id="rows"></div>
<h2>Last 12 leads</h2>
<div class="feed" id="feed"></div>
<div class="stamp" id="stamp"></div>
<script>
const KEY = "{{ key }}";
const VC = {"HOT HAND":"v-hot","STEADY":"v-steady","STRETCHED":"v-str","QUIET":"v-quiet","WARMING UP":"v-warm"};
// CallAction audit doorway: only speaks when something is waiting.
fetch("/api/dispatch/callaction?key="+encodeURIComponent(KEY))
  .then(r=>r.json()).then(d=>{
    const n=(d.counts||{}).pending||0, p=(d.counts||{}).pending_positive||0;
    if(!n) return;
    document.getElementById("ca-door").innerHTML=
      '<a href="/callaction?key='+encodeURIComponent(KEY)+'" style="display:block;'+
      'background:#fdfcf8;border:1px solid #e1ddd0;border-left:4px solid #2340d6;'+
      'border-radius:10px;padding:11px 14px;color:#191b1e;text-decoration:none;font-size:14px">'+
      '💬 <b>'+n+' CallAction '+(n===1?'reply':'replies')+'</b> waiting on your call'+
      (p? ', <b style="color:#0d7a4e">'+p+' with real intent</b>':'')+
      ' → tap to audit</a>';
  }).catch(()=>{});
async function load(){
  try{
    const r = await fetch("/api/dispatch/hothand?key="+encodeURIComponent(KEY));
    const d = await r.json();
    if(!d.ok) return;
    const h = d.head||{};
    document.getElementById("tiles").innerHTML = [
      [h.median_offer_to_voice_min!=null?h.median_offer_to_voice_min+"m":"—","offer to human voice, median 7d"],
      [(h.claimed_7d||0)+" / "+(h.leads_7d||0),"leads claimed, 7d"],
      [h.reached_nobody_7d||0,"reached nobody, 7d"],
      [h.convos||0,"conversations, 14d"],
      [(h.appts_set||0)+" / "+(h.appts_met||0),"appts set / met, 14d"],
    ].map(t=>`<div class="tile"><b>${t[0]}</b><span>${t[1]}</span></div>`).join("");
    if(d.needs_you){
      const a=document.getElementById("alert");
      const bits=[];
      if(h.terminal_24h) bits.push(h.terminal_24h+" lead"+(h.terminal_24h==1?"":"s")+" reached nobody in the last 24h");
      if((d.needs_names||[]).length) bits.push("look at: "+d.needs_names.join(", "));
      a.textContent = "Needs you: "+bits.join(" · ");
      a.style.display="block";
      document.getElementById("calm").style.display="none";
    } else {
      document.getElementById("calm").style.display="block";
      document.getElementById("alert").style.display="none";
    }
    document.getElementById("rows").innerHTML = (d.agents||[]).map(x=>`
      <div class="row">
        <div class="top">
          <span>${x.emoji}</span>
          <span class="name">${x.agent}</span>
          <span class="v ${VC[x.verdict]||''}">${x.verdict}</span>
          ${x.on_appt_now?'<span class="chip">on an appointment now</span>':''}
          ${x.appts_today?'<span class="chip">'+x.appts_today+' appt'+(x.appts_today==1?'':'s')+' today</span>':''}
        </div>
        <div class="line">${x.line}</div>
        <div class="act">${x.action}</div>
      </div>`).join("") || "<div class='line'>No offers in the last 14 days.</div>";
    document.getElementById("feed").innerHTML = (d.feed||[]).map(f=>{
      let s = f.met?'<span class="ok">MET</span>':f.appt?'<span class="ok">appointment set</span>':
              f.called?'<span class="ok">called</span>':f.claimed?'claimed':
              f.terminal?'<span class="bad">reached nobody</span>':'offered';
      return `<div><b>${(f.lead||'Lead').split(' ')[0]}</b> → ${f.agent||''} · ${s}</div>`;
    }).join("");
    document.getElementById("stamp").textContent =
      "Live from claim receipts · refreshes every 60s · " + new Date().toLocaleTimeString();
  }catch(e){}
}
load(); setInterval(load, 60000);
</script></div></body></html>
