<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mission Control</title>
<style>
:root{
  --bg:#0f172a; --panel:#16213e; --panel2:#1c2a4a; --line:#26365c;
  --ink:#e8eefc; --muted:#93a4c4; --gold:#f5a623;
  --gray:#7c8aa5; --amber:#f5a623; --green:#37c98b; --red:#e5544b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:14px}
.wrap{max-width:920px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 6px}
.asof{color:var(--muted);font-size:11.5px;margin:0 0 18px}
.sec{margin:26px 0 10px;font-size:11px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold)}
details.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  margin:0 0 10px;overflow:hidden}
details.row[open]{border-color:#31446f}
summary{cursor:pointer;padding:13px 16px;list-style:none;display:flex;
  align-items:baseline;gap:10px;line-height:1.45}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--panel2)}
.dot{width:10px;height:10px;border-radius:99px;flex:0 0 10px;align-self:center}
.dot.green{background:var(--green)} .dot.amber{background:var(--amber)}
.dot.red{background:var(--red)} .dot.gray{background:var(--gray)}
.nm{font-weight:700;white-space:nowrap}
.sm{color:var(--muted);font-size:12.5px}
.body{padding:4px 16px 14px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #1d2b4d;font-size:12.5px;color:#c9d5ec}
tr:last-child td{border-bottom:none}
.empty{color:var(--muted);font-size:12.5px;padding:10px 0 2px}
.banner{background:rgba(229,84,75,.12);border:1px solid rgba(229,84,75,.5);color:#ffb3ad;
  border-radius:9px;padding:11px 14px;margin:0 0 16px;font-size:13px}
.spin{color:var(--muted);padding:26px;text-align:center}
@media (max-width:640px){ summary{flex-wrap:wrap} .sm{flex-basis:100%;margin-left:20px} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mission Control</h1>
  <p class="sub">What the machine did, receipts included.</p>
  <p class="asof" id="asof">Loading...</p>
  <div id="banner-wrap"></div>
  <div id="rows"><div class="spin">Loading...</div></div>
</div>

<script>
var KEY = {{ api_key|tojson }};
function qs(p){ return KEY ? (p + (p.indexOf('?')>-1?'&':'?') + 'key=' + encodeURIComponent(KEY)) : p; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function label(k){ return k.replace(/_/g,' '); }

function detailTable(rows){
  if(!rows || !rows.length) return '<div class="empty">Nothing to show yet.</div>';
  var cols = Object.keys(rows[0]);
  var h='<table><thead><tr>';
  cols.forEach(function(c){ h+='<th>'+esc(label(c))+'</th>'; });
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr>';
    cols.forEach(function(c){
      var v=r[c];
      h+='<td>'+(v==null||v===''?'<span style="color:var(--gray)">unknown</span>':esc(v))+'</td>';
    });
    h+='</tr>';
  });
  return h+'</tbody></table>';
}

function render(d){
  document.getElementById('asof').textContent =
    'As of ' + (d.generated_at_et || 'now') + '. Refreshes every minute.';
  var openNow = {};
  var existing = document.querySelectorAll('details.row');
  for(var i=0;i<existing.length;i++){
    if(existing[i].open) openNow[existing[i].getAttribute('data-name')] = true;
  }
  var h='', lastSec=null;
  (d.rows||[]).forEach(function(r){
    if(r.section !== lastSec){
      h+='<div class="sec">'+esc(r.section)+'</div>';
      lastSec = r.section;
    }
    h+='<details class="row" data-name="'+esc(r.name)+'"'+(openNow[r.name]?' open':'')+'>'+
       '<summary><span class="dot '+esc(r.dot||'gray')+'"></span>'+
       '<span class="nm">'+esc(r.name)+'</span>'+
       '<span class="sm">'+esc(r.summary||'')+'</span></summary>'+
       '<div class="body">'+detailTable(r.detail_rows)+'</div>'+
       '</details>';
  });
  document.getElementById('rows').innerHTML = h || '<div class="empty">No systems reported.</div>';
  document.getElementById('banner-wrap').innerHTML = '';
}

function load(){
  fetch(qs('/api/admin/system-status'))
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(render)
    .catch(function(e){
      document.getElementById('banner-wrap').innerHTML =
        '<div class="banner">Could not load system status ('+esc(e.message)+'). Retrying on the next refresh.</div>';
    });
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
