<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Today</title>
<style>
body{margin:0;background:#0d1117;color:#e8edf8;font-family:-apple-system,'Segoe UI',sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:1.6rem 1rem 3rem}
.kick{font-size:.62rem;font-weight:800;letter-spacing:.18em;color:#f5a623;text-transform:uppercase}
h1{font-size:1.5rem;font-weight:900;margin:.25rem 0 1rem}
.verdict{font-size:1.05rem;font-weight:700;margin-bottom:1.1rem}
.verdict.calm{background:#12251a;border:1px solid #1f4430;color:#7ee2a8;border-radius:14px;padding:1rem 1.2rem}
.item{background:#151b24;border:1px solid #232c3a;border-left:4px solid #f5a623;border-radius:12px;padding:.85rem 1rem;margin-bottom:.6rem;display:block;text-decoration:none;color:#e8edf8}
.item.hot{border-left-color:#ff6b6b}
.item .w{font-weight:800;font-size:.98rem}
.item .d{font-size:.84rem;color:#aab6c8;margin-top:.2rem}
.item .d::before{content:"\2192  ";color:#f5a623}
.links{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.4rem}
.links a{background:#151b24;border:1px solid #232c3a;border-radius:10px;padding:.5rem .85rem;color:#f5a623;text-decoration:none;font-size:.85rem;font-weight:700}
.stamp{font-size:.68rem;color:#5c6a80;margin-top:1.2rem}
</style></head><body><div class="wrap">
<div class="kick">Legacy Command Center</div>
<h1>Today</h1>
<div id="verdict" class="verdict"></div>
<div id="items"></div>
<div class="links">
  <a href="/salesfloor">Sales Floor</a>
  <a href="/dispatch">Lead Claims</a>
  <a href="/calls">Call Library</a>
  <a href="/team/onboarding">Onboarding</a>
  <a href="/">Dashboard</a>
</div>
<div class="stamp" id="stamp"></div>
<script>
async function load(){
  try{
    const d = await (await fetch("/api/today")).json();
    if(!d.ok) return;
    const v = document.getElementById("verdict");
    v.textContent = d.verdict;
    v.className = "verdict" + ((d.items||[]).length ? "" : " calm");
    document.getElementById("items").innerHTML = (d.items||[]).map(i=>`
      <a class="item${i.sev===0?" hot":""}" href="${i.link}" ${i.link&&i.link.startsWith("http")?'target="_blank"':''}>
        <div class="w">${i.what}</div>
        <div class="d">${i.do}</div>
      </a>`).join("");
    document.getElementById("stamp").textContent =
      "Decisions, already made · refreshes every 5 min · " + new Date().toLocaleTimeString();
  }catch(e){}
}
load(); setInterval(load, 300000);
</script></div></body></html>
