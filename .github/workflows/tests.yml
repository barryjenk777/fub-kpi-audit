# Nov 6 2026 audit, punch list #9: golden tests on the money paths run on
# every push. Railway still deploys main regardless of this result; to make
# deploys WAIT for green, flip on "Wait for CI" in the Railway service
# settings (one checkbox, no code change).
name: money-path-tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run money-path tests (db stubbed, no secrets needed)
        run: python -m unittest tests.test_money_paths -v
